# Rebuild contributor data from merged pull requests and commit it when it changes.
# Runs on the default branch after merge. It does not run pull request code.

name: Contributor sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/data/contributors.json"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: contributor-sync
  cancel-in-progress: false

jobs:
  sync:
    if: "${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: update contributor recognition data') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Require contributor sync token
        env:
          CONTRIBUTOR_SYNC_TOKEN: ${{ secrets.CONTRIBUTOR_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CONTRIBUTOR_SYNC_TOKEN}" ]; then
            echo "CONTRIBUTOR_SYNC_TOKEN is not set."
            echo "Create a fine-grained personal access token for a repository admin, with Contents set to Read and write on this repository."
            echo "Save it as the Actions secret CONTRIBUTOR_SYNC_TOKEN."
            echo "The default GITHUB_TOKEN cannot push to main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.CONTRIBUTOR_SYNC_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure contributor labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/contributors/labels.mjs

      - name: Update contributor data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/contributors/sync.mjs

      - name: Commit contributor data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/contributors.json
          if git diff --cached --quiet; then
            echo "Contributor data is already up to date."
            exit 0
          fi
          git commit -m "chore: update contributor recognition data"
          git push origin HEAD:main
